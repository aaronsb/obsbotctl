[workspace]
resolver = "2"
members = [
    "crates/obsbot",
    "crates/obsbot-proto",
    "crates/obsbotctl",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Aaron Bockelie"]
repository = "https://github.com/aaronsb/libobsbot"
rust-version = "1.75"

# Workspace-wide dependency versions. Individual crates pick what they need.
# Entries commented with "(planned)" are not used by the current scaffold but
# document the intended stack for future sessions.
[workspace.dependencies]
thiserror = "1"
# CRC-16/USB for packet checks. Held below 3.4, whose MSRV (1.83) is above
# the workspace rust-version.
crc = "~3.3"
tracing = "0.1"

# (planned) BlueZ client for the Bluetooth transport
zbus = "4"

# (planned) USB and device access
nusb = "0.1"
udev = "0.8"
rustix = { version = "0.38", features = ["fs"] }

# (planned) Binary protocol parsing for XU payloads
zerocopy = { version = "0.7", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
